<div
  data-testid="tree"
  class="flex flex-col gap-2"
  [attr.aria-busy]="loading() ? 'true' : null"
  [class]="loading() && nodes().length > 0 ? 'pointer-events-none opacity-60' : ''"
>
  <div class="flex justify-end gap-3 text-sm">
    <button
      type="button"
      class="cursor-pointer underline disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="filtering()"
      (click)="expandAll.emit()"
    >
      Expand all
    </button>
    <button
      type="button"
      class="cursor-pointer underline disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="filtering()"
      (click)="collapseAll.emit()"
    >
      Collapse all
    </button>
  </div>

  <ul
    class="m-0 list-none overflow-hidden rounded-2xl border border-surface-200 bg-surface-0 p-0 dark:border-surface-800 dark:bg-surface-900"
  >
    @for (node of nodes(); track node.parent.id) {
      <li class="border-t border-surface-100 first:border-t-0 dark:border-surface-800">
        <div
          data-testid="tree-row"
          class="flex items-center gap-1 pl-2"
          [class]="
            selectedCategoryId() === node.parent.id ? 'bg-primary-50 dark:bg-primary-900/30' : ''
          "
        >
          @if (showChecks()) {
            <input
              type="checkbox"
              class="size-4 cursor-pointer"
              [checked]="ticked().has(node.parent.id)"
              [disabled]="!tickable().has(node.parent.id)"
              [attr.aria-label]="'Select ' + node.parent.name"
              (change)="onTick($event, node.parent.id)"
            />
          }
          @if (node.children.length > 0) {
            <button
              type="button"
              class="cursor-pointer rounded-lg px-2 py-2 text-muted-color disabled:cursor-not-allowed disabled:opacity-50"
              [disabled]="filtering()"
              [attr.aria-label]="
                (expandedIds().has(node.parent.id) ? 'Collapse ' : 'Expand ') + node.parent.name
              "
              [attr.aria-expanded]="expandedIds().has(node.parent.id)"
              (click)="toggleExpand.emit(node.parent.id)"
            >
              <i
                class="pi"
                [class]="expandedIds().has(node.parent.id) ? 'pi-chevron-down' : 'pi-chevron-right'"
                aria-hidden="true"
              ></i>
            </button>
          } @else {
            <span class="w-8" aria-hidden="true"></span>
          }
          <button
            type="button"
            data-testid="open-category"
            class="flex min-w-0 flex-1 cursor-pointer items-center gap-3 py-3 pr-4 text-left"
            (click)="openCategory.emit(node.parent)"
          >
            <span
              class="size-3 shrink-0 rounded-full"
              [style.background-color]="color(node.parent)"
              aria-hidden="true"
            ></span>
            <span class="min-w-0 flex-1">
              <span class="block truncate font-medium text-surface-900 dark:text-surface-0">
                {{ node.parent.name }}
              </span>
              @if (node.subcategoryCount > 0) {
                <span class="block text-sm text-muted-color">
                  {{ subcategoryLabel(node.subcategoryCount) }}
                </span>
              }
            </span>
            @if (parentCount(node) === null) {
              <span class="text-sm font-medium text-amber-700 dark:text-amber-400">Unused</span>
            } @else {
              <span class="font-semibold tabular-nums">{{ parentCount(node) }}</span>
            }
          </button>
        </div>

        @if (node.children.length > 0 && expandedIds().has(node.parent.id)) {
          <ul class="m-0 list-none p-0">
            @for (child of node.children; track child.id) {
              <li class="border-t border-surface-100 dark:border-surface-800">
                <div
                  data-testid="tree-row"
                  class="flex items-center gap-1 pl-10"
                  [class]="
                    selectedCategoryId() === child.id ? 'bg-primary-50 dark:bg-primary-900/30' : ''
                  "
                >
                  @if (showChecks()) {
                    <input
                      type="checkbox"
                      class="size-4 cursor-pointer"
                      [checked]="ticked().has(child.id)"
                      [disabled]="!tickable().has(child.id)"
                      [attr.aria-label]="'Select ' + child.name"
                      (change)="onTick($event, child.id)"
                    />
                  }
                  <button
                    type="button"
                    data-testid="open-category"
                    class="flex min-w-0 flex-1 cursor-pointer items-center gap-3 py-2.5 pr-4 text-left"
                    (click)="openCategory.emit(child)"
                  >
                    <span
                      class="size-2.5 shrink-0 rounded-full"
                      [style.background-color]="color(child)"
                      aria-hidden="true"
                    ></span>
                    <span class="min-w-0 flex-1 truncate">{{ child.name }}</span>
                    @if (childCount(child) === null) {
                      <span class="text-sm font-medium text-amber-700 dark:text-amber-400">
                        Unused
                      </span>
                    } @else {
                      <span class="tabular-nums">{{ childCount(child) }}</span>
                    }
                  </button>
                </div>
              </li>
            }
          </ul>
        }
      </li>
    }
  </ul>
</div>
