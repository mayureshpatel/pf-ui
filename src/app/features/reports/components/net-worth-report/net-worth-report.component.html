@if (loading()) {
  <div class="flex flex-col justify-center items-center py-32 gap-4">
    <p-progressSpinner strokeWidth="4"/>
    <span class="text-muted-color font-bold uppercase tracking-widest animate-pulse">Calculating Net Worth...</span>
  </div>
} @else if (loadError()) {
  <app-page-error-state message="Failed to load net worth data." (retry)="loadNetWorth()"/>
} @else {
  <div class="grid grid-cols-1 gap-8">
    <p-card class="h-full card-soft">
      <ng-template pTemplate="title">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <i class="pi pi-wallet text-primary"></i>
            <span class="text-xl font-extrabold text-surface-900 dark:text-surface-0 tracking-tight">Net Worth Over Time</span>
          </div>
          @if (currentNetWorth(); as current) {
            <span class="font-mono font-black text-lg text-primary">{{ current | formatCurrency }}</span>
          }
        </div>
      </ng-template>

      @if (hasData()) {
        <div class="h-[400px] w-full mt-4">
          <p-chart type="line" [data]="chartData()" [options]="chartOptions" class="h-full w-full"/>
        </div>
      } @else {
        <div class="flex flex-col items-center justify-center h-[400px] text-center animate-fade-in">
          <i class="pi pi-wallet text-4xl text-surface-200 dark:text-surface-700 mb-2"></i>
          <span class="text-sm font-bold text-surface-400 dark:text-surface-500 uppercase tracking-widest">No net worth data</span>
          <p class="text-xs text-muted-color mt-1">Add an account to start tracking your net worth.</p>
        </div>
      }
    </p-card>
  </div>
}
