<section
  aria-labelledby="net-worth-moved-title"
  class="rounded-xl border border-surface-200 bg-surface-0 p-4 dark:border-surface-800 dark:bg-surface-900"
>
  <h3 id="net-worth-moved-title" class="m-0 mb-2 text-sm font-semibold">{{ heading() }}</h3>
  <ul class="m-0 flex list-none flex-col gap-1 p-0 text-sm">
    @for (row of rows(); track row.label) {
      <li
        data-testid="moved-row"
        class="flex items-baseline justify-between gap-3"
        [class.border-t]="row.total"
        [class.border-surface-200]="row.total"
        [class.pt-1]="row.total"
        [class.font-semibold]="row.total"
      >
        <span>{{ row.label }}</span>
        <span class="tabular-nums">
          {{ row.amount }}
          @if (row.direction; as direction) {
            <span class="sr-only">{{ direction }}</span>
          }
        </span>
      </li>
    }
  </ul>
  <p class="m-0 mt-2 text-xs text-muted-color">Saved plus the rest adds up to the total change.</p>
</section>
