<div class="flex flex-col gap-4 max-lg:flex-row max-lg:items-center max-lg:justify-between">
  <div>
    <p class="m-0 stat-figure">{{ merchantsText() }}</p>
    @if (unlinkedText(); as unlinked) {
      <p data-testid="unlinked-line" class="mt-2 text-sm text-muted-color">{{ unlinked }}</p>
    } @else if (statsFailed()) {
      <p data-testid="unlinked-failed" class="mt-2 text-sm text-muted-color">
        Couldn't load the description totals.
        <button type="button" class="cursor-pointer underline" (click)="retryStats.emit()">
          Try again
        </button>
      </p>
    } @else {
      <div
        data-testid="unlinked-skeleton"
        class="mt-2 h-4 w-3/4 animate-pulse rounded-md bg-surface-200 dark:bg-surface-700"
        aria-hidden="true"
      ></div>
    }
    @if (showCreateHint()) {
      <p data-testid="create-hint" class="mt-2 text-sm text-muted-color max-lg:hidden">
        Create a merchant, then link the transaction descriptions that belong to it.
      </p>
    }
  </div>

  <div class="flex flex-col gap-2">
    @if (canLink()) {
      <button
        type="button"
        class="cursor-pointer rounded-lg border border-surface-300 px-3 py-2 text-sm font-medium max-lg:min-h-11 dark:border-surface-700"
        (click)="linkDescriptions.emit()"
      >
        Link descriptions
      </button>
    }
  </div>
</div>
