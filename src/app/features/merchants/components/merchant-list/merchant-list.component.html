<div
  data-testid="merchant-list"
  [attr.aria-busy]="loading() ? 'true' : null"
  [class]="loading() && merchants().length > 0 ? 'pointer-events-none opacity-60' : ''"
>
  @if (merchants().length === 0) {
    @if (searching()) {
      <div
        class="flex flex-col items-center gap-3 rounded-2xl border border-surface-200 bg-surface-0 p-8 text-center dark:border-surface-800 dark:bg-surface-900"
      >
        <p class="m-0 font-medium">No merchants match your search</p>
        <button
          type="button"
          class="cursor-pointer rounded-lg border border-surface-300 px-3 py-1.5 text-sm dark:border-surface-700"
          (click)="clearSearch.emit()"
        >
          Clear search
        </button>
      </div>
    }
  } @else {
    <ul
      class="m-0 list-none overflow-hidden rounded-2xl border border-surface-200 bg-surface-0 p-0 dark:border-surface-800 dark:bg-surface-900"
    >
      @for (merchant of merchants(); track merchant.id) {
        <li class="border-t border-surface-100 first:border-t-0 dark:border-surface-800">
          <div
            data-testid="merchant-row"
            [class]="selectedId() === merchant.id ? 'bg-primary-50 dark:bg-primary-900/30' : ''"
          >
            <button
              type="button"
              data-testid="open-merchant"
              class="flex w-full min-w-0 cursor-pointer items-center gap-3 px-4 py-3 text-left"
              (click)="openMerchant.emit(merchant)"
            >
              <span class="min-w-0 flex-1">
                <span class="block truncate font-medium text-surface-900 dark:text-surface-0">
                  {{ merchant.name }}
                </span>
                <span class="block truncate text-sm text-muted-color">
                  {{ location(merchant) }}
                </span>
              </span>
              <span
                class="shrink-0 text-sm tabular-nums"
                [class]="
                  hasLinks(merchant)
                    ? 'text-muted-color'
                    : 'font-medium text-amber-700 dark:text-amber-400'
                "
              >
                {{ links(merchant) }}
              </span>
            </button>
          </div>
        </li>
      }
    </ul>

    <div class="mt-3 flex items-center justify-between gap-3 text-sm text-muted-color">
      <span data-testid="range" class="tabular-nums">{{ rangeText() }}</span>
      <span class="flex gap-2">
        <button
          type="button"
          class="cursor-pointer rounded-lg border border-surface-300 px-3 py-1.5 disabled:cursor-not-allowed disabled:opacity-50 dark:border-surface-700"
          [disabled]="!hasPrevious()"
          (click)="pageChange.emit(page() - 1)"
        >
          Previous page
        </button>
        <button
          type="button"
          class="cursor-pointer rounded-lg border border-surface-300 px-3 py-1.5 disabled:cursor-not-allowed disabled:opacity-50 dark:border-surface-700"
          [disabled]="!hasNext()"
          (click)="pageChange.emit(page() + 1)"
        >
          Next page
        </button>
      </span>
    </div>
  }
</div>
