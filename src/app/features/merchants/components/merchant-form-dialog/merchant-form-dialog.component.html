<!-- PF-945: appended to the body so Esc, which PrimeNG listens for on the document, cannot also reach the side panel behind this dialog and raise its Discard prompt. -->
<p-dialog
  [header]="dialogHeader()"
  [(visible)]="visible"
  appRestoreFocusOnHide
  appendTo="body"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '500px' }"
  [breakpoints]="{ '960px': '95vw' }"
  class="p-fluid"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6 py-4">
    @if (errorMessage()) {
      <p-message severity="error" variant="simple" class="w-full animate-fade-in">
        {{ errorMessage() }}
      </p-message>
    }

    <div class="flex flex-col gap-2">
      <label for="merchant-name" class="text-sm font-medium"> Name </label>
      <input
        pInputText
        id="merchant-name"
        formControlName="name"
        placeholder="e.g. Whole Foods"
        class="w-full"
      />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <small
          class="text-rose-700 dark:text-rose-400 font-medium flex items-center gap-1 animate-fade-in"
        >
          <i class="pi pi-times-circle text-xs"></i> A name is required
        </small>
      }
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-2">
        <label for="merchant-city" class="text-sm font-medium"> City </label>
        <input
          pInputText
          id="merchant-city"
          formControlName="city"
          placeholder="Optional"
          class="w-full"
        />
      </div>
      <div class="flex flex-col gap-2">
        <label for="merchant-state" class="text-sm font-medium"> State </label>
        <input
          pInputText
          id="merchant-state"
          formControlName="state"
          placeholder="Optional"
          class="w-full"
        />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-2">
        <label for="merchant-postal-code" class="text-sm font-medium"> Postal Code </label>
        <input
          pInputText
          id="merchant-postal-code"
          formControlName="postalCode"
          placeholder="Optional"
          class="w-full"
        />
      </div>
      <div class="flex flex-col gap-2">
        <label for="merchant-country" class="text-sm font-medium"> Country </label>
        <input
          pInputText
          id="merchant-country"
          formControlName="country"
          placeholder="Optional"
          class="w-full"
        />
      </div>
    </div>
  </form>

  <ng-template #footer>
    <div class="flex justify-end gap-3">
      <p-button
        label="Cancel"
        [text]="true"
        severity="secondary"
        styleClass="min-h-11"
        (onClick)="onHide()"
      />
      <p-button
        label="Save"
        icon="pi pi-check"
        (onClick)="onSubmit()"
        [loading]="saving()"
        [disabled]="form.invalid || saving()"
        styleClass="min-h-11"
      />
    </div>
  </ng-template>
</p-dialog>
