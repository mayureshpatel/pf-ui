<p-dialog
  header="Correct Merchant Name"
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '450px' }"
  class="p-fluid">

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-8 py-4">
    @if (errorMessage()) {
      <p-message severity="error" variant="simple" class="w-full animate-fade-in">
        {{ errorMessage() }}
      </p-message>
    }

    <div class="flex flex-col gap-2">
      <label for="original-name" class="text-sm font-bold uppercase tracking-wide text-surface-700 dark:text-surface-200">
        Original Bank Description
      </label>
      <div id="original-name" class="text-sm font-mono text-muted-color px-1">
        {{ merchant()?.originalName }}
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <label for="clean-name" class="text-sm font-bold uppercase tracking-wide text-surface-700 dark:text-surface-200">
        Display Name
      </label>
      <input
        pInputText
        id="clean-name"
        formControlName="cleanName"
        placeholder="Enter a readable name..."
        class="w-full"
        [autofocus]="true"
      />
      @if (form.controls.cleanName.invalid && form.controls.cleanName.touched) {
        <small class="text-rose-500 font-medium flex items-center gap-1 animate-fade-in">
          <i class="pi pi-times-circle text-xs"></i> A display name is required
        </small>
      }
    </div>
  </form>

  <ng-template #footer>
    <div class="flex justify-end gap-3 pt-4 border-t border-surface-100 dark:border-surface-800">
      <p-button
        label="Cancel"
        [text]="true"
        severity="secondary"
        (onClick)="onHide()"
      />
      <p-button
        label="Save"
        icon="pi pi-check"
        (onClick)="onSubmit()"
        [loading]="saving()"
        [disabled]="form.invalid || saving()"
        [raised]="true"
      />
    </div>
  </ng-template>
</p-dialog>
