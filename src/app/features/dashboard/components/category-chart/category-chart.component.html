<p-card class="h-full">
  <ng-template pTemplate="title">
    <span class="text-lg font-semibold text-surface-900 dark:text-surface-0">{{ title() }}</span>
  </ng-template>

  <div class="mt-4 w-full">
    @if (hasData()) {
      <ul role="list" class="m-0 flex list-none flex-col gap-4 p-0">
        @for (row of rows(); track row.name) {
          <li data-testid="category-row" class="flex flex-col gap-1.5">
            <div class="flex items-baseline justify-between gap-3">
              <span
                class="min-w-0 truncate text-sm font-semibold text-surface-900 dark:text-surface-0"
                >{{ row.name }}</span
              >
              <span
                class="shrink-0 text-sm font-medium tabular-nums text-surface-900 dark:text-surface-0"
                >{{ row.amount | formatCurrency }}</span
              >
            </div>
            <div
              aria-hidden="true"
              class="h-2 w-full overflow-hidden rounded-full bg-surface-200 dark:bg-surface-700"
            >
              <div
                class="h-full rounded-full"
                [style.width.%]="row.widthPct"
                [style.background-color]="row.color"
              ></div>
            </div>
          </li>
        }
      </ul>
    } @else {
      <div class="flex h-48 flex-col items-center justify-center text-center animate-fade-in">
        <div class="w-16 h-16 rounded-full flex items-center justify-center mb-4">
          <i class="pi pi-chart-bar text-2xl text-surface-300 dark:text-surface-600"></i>
        </div>
        <span class="text-sm font-medium text-muted-color"
          >No spending recorded for this period.</span
        >
        <p class="text-sm text-muted-color mt-1">Try a different time period.</p>
      </div>
    }
  </div>
</p-card>
