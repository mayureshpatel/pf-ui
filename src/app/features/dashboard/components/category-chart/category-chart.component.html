<p-card class="h-full">
  <ng-template pTemplate="title">
    <span class="text-lg font-semibold text-surface-900 dark:text-surface-0">{{ title() }}</span>
  </ng-template>

  <div class="h-80 w-full mt-4">
    @if (hasData()) {
      <p-chart type="bar" [data]="chartData()" [options]="chartOptions" class="h-full w-full" />
    } @else {
      <div class="flex flex-col items-center justify-center h-full text-center animate-fade-in">
        <div class="w-16 h-16 rounded-full flex items-center justify-center mb-4">
          <i class="pi pi-chart-bar text-2xl text-surface-300 dark:text-surface-600"></i>
        </div>
        <span class="text-sm font-medium text-muted-color"
          >No spending recorded for this period.</span
        >
        <p class="text-sm text-muted-color mt-1">Try a different time period.</p>
      </div>
    }
  </div>
</p-card>
