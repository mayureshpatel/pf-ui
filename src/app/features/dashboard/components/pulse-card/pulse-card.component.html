<p-card class="h-full">
  <div class="flex flex-col gap-3">
    <span class="text-sm font-medium text-muted-color">{{ title() }}</span>

    <div class="flex items-baseline justify-between">
      <span
        class="text-3xl font-bold tracking-tight tabular-nums"
        [class]="color() || 'text-surface-900 dark:text-surface-0'"
      >
        {{ formattedValue() }}
      </span>

      <div
        [class]="
          trendStyles() +
          ' flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-full ring-1'
        "
      >
        <i [class]="trendIcon() + ' text-xs'"></i>
        <span>{{ Math.abs(trend()).toFixed(0) }}%</span>
      </div>
    </div>

    <span class="text-sm text-muted-color">
      vs
      {{
        type() === 'percent' ? previousValue().toFixed(1) + '%' : (previousValue() | formatCurrency)
      }}
      last period
    </span>
  </div>
</p-card>
