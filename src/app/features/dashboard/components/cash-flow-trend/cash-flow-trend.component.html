<p-card class="h-full">
  <ng-template pTemplate="title">
    <div class="flex flex-col">
      <span class="text-lg font-semibold text-surface-900 dark:text-surface-0">Cash flow</span>
      <span class="text-sm font-normal text-muted-color">Last 12 months</span>
    </div>
  </ng-template>

  <div class="h-80 w-full mt-4">
    <p-chart type="bar" [data]="chartData()" [options]="chartOptions" class="h-full w-full" />
  </div>
</p-card>
