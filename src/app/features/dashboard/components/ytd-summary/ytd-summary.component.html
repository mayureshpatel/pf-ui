<p-card class="h-full">
  <div class="flex flex-col gap-6">
    <span class="text-lg font-semibold text-surface-900 dark:text-surface-0"
      >{{ year() }} so far</span
    >

    <div class="grid grid-cols-1 gap-4">
      <div
        class="flex justify-between items-center p-3 rounded-xl border border-surface-100 dark:border-surface-800"
      >
        <span class="text-sm text-muted-color">Income</span>
        <span class="font-semibold tabular-nums text-emerald-600 dark:text-emerald-400">
          {{ totalIncome() | formatCurrency }}
        </span>
      </div>

      <div
        class="flex justify-between items-center p-3 rounded-xl border border-surface-100 dark:border-surface-800"
      >
        <span class="text-sm text-muted-color">Expenses</span>
        <span class="font-semibold tabular-nums text-rose-600 dark:text-rose-400">
          {{ totalExpense() | formatCurrency }}
        </span>
      </div>

      <div
        class="flex justify-between items-center p-4 rounded-xl bg-primary/5 border border-primary/10"
      >
        <span class="text-sm font-medium text-primary-700 dark:text-primary-400">Net savings</span>
        <span class="text-xl font-bold tabular-nums text-primary-700 dark:text-primary-400">
          {{ netSavings() | formatCurrency }}
        </span>
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <div class="flex justify-between items-center">
        <span class="text-sm text-muted-color">Average savings rate</span>
        <span
          [class]="savingsRateStyles() + ' px-2 py-0.5 rounded text-sm font-medium tabular-nums'"
        >
          {{ avgSavingsRate().toFixed(1) }}%
        </span>
      </div>
      <div class="h-2 w-full rounded-full overflow-hidden bg-surface-200 dark:bg-surface-700">
        <div
          class="bg-primary h-full rounded-full"
          [style.width.%]="Math.min(Math.max(avgSavingsRate(), 0), 100)"
        ></div>
      </div>
    </div>
  </div>
</p-card>
