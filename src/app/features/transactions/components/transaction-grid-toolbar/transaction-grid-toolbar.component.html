<div class="flex flex-col gap-2">
  <button
    type="button"
    data-testid="toolbar-toggle"
    class="inline-flex min-h-11 cursor-pointer items-center justify-between gap-2 rounded-xl border border-surface-200 bg-surface-0 px-3 text-sm font-medium text-surface-900 lg:hidden dark:border-surface-800 dark:bg-surface-900 dark:text-surface-0 focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary-700 dark:focus-visible:outline-primary-400"
    aria-controls="grid-tools"
    [attr.aria-expanded]="toolsOpen()"
    (click)="toolsOpen.set(!toolsOpen())"
  >
    <span>Grid tools</span>
    <i
      class="pi text-xs"
      [class]="toolsOpen() ? 'pi-chevron-up' : 'pi-chevron-down'"
      aria-hidden="true"
    ></i>
  </button>
  <div
    id="grid-tools"
    role="toolbar"
    aria-label="Grid tools"
    class="flex-wrap items-center gap-x-3 gap-y-2 rounded-xl border border-surface-200 bg-surface-0 px-3 py-2 lg:flex dark:border-surface-800 dark:bg-surface-900"
    [class]="toolsOpen() ? 'flex' : 'hidden'"
  >
    <button
      type="button"
      data-testid="toolbar-create-rule"
      class="inline-flex min-h-11 cursor-pointer items-center gap-2 rounded-lg border border-surface-300 px-3 text-sm font-medium text-surface-900 hover:bg-surface-100 lg:min-h-8 focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary-700 dark:focus-visible:outline-primary-400 disabled:cursor-not-allowed disabled:opacity-50 dark:border-surface-700 dark:text-surface-0 dark:hover:bg-surface-800"
      [disabled]="selectionCount() === 0"
      (click)="onCreateRule()"
    >
      <i class="pi pi-bolt text-sm" aria-hidden="true"></i>
      Create rule
    </button>
    @if (selectionCount() === 0) {
      <span data-testid="toolbar-create-rule-hint" class="text-sm text-muted-color">
        Select rows to create a rule
      </span>
    }
    <span class="flex flex-wrap items-center gap-2" role="group" aria-label="Highlight rows">
      <span class="text-sm text-muted-color">Highlight</span>
      @for (option of highlightOptions; track option.key) {
        <button
          type="button"
          role="switch"
          [attr.data-testid]="option.testId"
          class="inline-flex min-h-11 cursor-pointer items-center gap-2 rounded-full border px-3 text-sm lg:min-h-8 focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary-700 dark:focus-visible:outline-primary-400"
          [class]="
            highlights()[option.key]
              ? 'border-amber-500 bg-amber-50 text-amber-900 dark:bg-amber-950/30 dark:text-amber-100'
              : 'border-surface-300 text-surface-900 hover:bg-surface-100 dark:border-surface-700 dark:text-surface-0 dark:hover:bg-surface-800'
          "
          [attr.aria-checked]="highlights()[option.key]"
          (click)="toggle(option.key)"
        >
          @if (highlights()[option.key]) {
            <i class="pi pi-check text-xs" aria-hidden="true"></i>
          }
          {{ option.label }}
          @if (highlights()[option.key] && counts()[option.key] !== null) {
            <span data-testid="highlight-count" class="tabular-nums">
              ({{ counts()[option.key] }})
            </span>
          }
        </button>
      }
    </span>
  </div>
</div>
