<div
  role="toolbar"
  aria-label="Grid tools"
  class="flex flex-wrap items-center gap-x-3 gap-y-2 rounded-xl border border-surface-200 bg-surface-0 px-3 py-2 dark:border-surface-800 dark:bg-surface-900"
>
  <button
    type="button"
    data-testid="toolbar-create-rule"
    class="inline-flex min-h-8 cursor-pointer items-center gap-2 rounded-lg border border-surface-300 px-3 text-sm font-medium text-surface-900 hover:bg-surface-100 focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary-700 disabled:cursor-not-allowed disabled:opacity-50 dark:border-surface-700 dark:text-surface-0 dark:hover:bg-surface-800 dark:focus-visible:outline-primary-400"
    [disabled]="selectionCount() === 0"
    (click)="onCreateRule()"
  >
    <i class="pi pi-bolt text-sm" aria-hidden="true"></i>
    Create rule
  </button>
  @if (selectionCount() === 0) {
    <span data-testid="toolbar-create-rule-hint" class="text-sm text-muted-color">
      Select rows to create a rule
    </span>
  }
  <span class="flex flex-wrap items-center gap-2" role="group" aria-label="Highlight rows">
    <span class="text-sm text-muted-color">Highlight</span>
    <button
      type="button"
      role="switch"
      data-testid="toolbar-highlight-no-category"
      class="inline-flex min-h-8 cursor-pointer items-center gap-2 rounded-full border px-3 text-sm focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary-700 dark:focus-visible:outline-primary-400"
      [class]="
        highlights().noCategory
          ? 'border-amber-500 bg-amber-50 text-amber-900 dark:bg-amber-950/30 dark:text-amber-100'
          : 'border-surface-300 text-surface-900 hover:bg-surface-100 dark:border-surface-700 dark:text-surface-0 dark:hover:bg-surface-800'
      "
      [attr.aria-checked]="highlights().noCategory"
      (click)="toggle('noCategory')"
    >
      No category
    </button>
    <button
      type="button"
      role="switch"
      data-testid="toolbar-highlight-no-merchant"
      class="inline-flex min-h-8 cursor-pointer items-center gap-2 rounded-full border px-3 text-sm focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary-700 dark:focus-visible:outline-primary-400"
      [class]="
        highlights().noMerchant
          ? 'border-amber-500 bg-amber-50 text-amber-900 dark:bg-amber-950/30 dark:text-amber-100'
          : 'border-surface-300 text-surface-900 hover:bg-surface-100 dark:border-surface-700 dark:text-surface-0 dark:hover:bg-surface-800'
      "
      [attr.aria-checked]="highlights().noMerchant"
      (click)="toggle('noMerchant')"
    >
      No merchant
    </button>
    <button
      type="button"
      role="switch"
      data-testid="toolbar-highlight-rule-covers"
      class="inline-flex min-h-8 cursor-pointer items-center gap-2 rounded-full border px-3 text-sm focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary-700 dark:focus-visible:outline-primary-400"
      [class]="
        highlights().ruleCovers
          ? 'border-amber-500 bg-amber-50 text-amber-900 dark:bg-amber-950/30 dark:text-amber-100'
          : 'border-surface-300 text-surface-900 hover:bg-surface-100 dark:border-surface-700 dark:text-surface-0 dark:hover:bg-surface-800'
      "
      [attr.aria-checked]="highlights().ruleCovers"
      (click)="toggle('ruleCovers')"
    >
      Rule covers it
    </button>
  </span>
</div>
