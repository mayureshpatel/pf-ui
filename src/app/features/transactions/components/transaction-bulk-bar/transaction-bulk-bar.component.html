@if (selectionCount() > 0) {
  <div
    role="region"
    [attr.aria-label]="'Bulk actions for ' + selectionCount() + ' selected transactions'"
    class="fixed inset-x-4 bottom-4 z-30 flex flex-wrap sm:left-auto sm:max-w-2xl items-center gap-3 rounded-xl bg-surface-900 px-4 py-3 text-surface-0 shadow-lg dark:bg-surface-100 dark:text-surface-900"
  >
    <span aria-live="polite" class="row-amount">{{ selectionCount() }} selected</span>
    <button
      type="button"
      class="inline-flex min-h-8 cursor-pointer items-center px-1 text-sm underline max-lg:min-h-11 disabled:opacity-50"
      [disabled]="busy()"
      (click)="setCategory.emit()"
    >
      Set category
    </button>
    @if (allTransfers()) {
      <button
        type="button"
        class="inline-flex min-h-8 cursor-pointer items-center px-1 text-sm underline max-lg:min-h-11 disabled:opacity-50"
        [disabled]="busy()"
        (click)="unmarkTransfer.emit()"
      >
        Unmark as transfer
      </button>
    } @else {
      <button
        type="button"
        class="inline-flex min-h-8 cursor-pointer items-center px-1 text-sm underline max-lg:min-h-11 disabled:opacity-50"
        [disabled]="busy()"
        (click)="markTransfer.emit()"
      >
        Mark as transfer
      </button>
    }
    <button
      type="button"
      class="inline-flex min-h-8 cursor-pointer items-center px-1 text-sm underline max-lg:min-h-11 max-lg:min-w-11 justify-center"
      (click)="editMore.emit()"
    >
      Edit more
    </button>
    <button
      type="button"
      class="ml-auto inline-flex min-h-8 cursor-pointer items-center px-1 text-sm underline max-lg:min-h-11 max-lg:min-w-11 justify-center"
      (click)="clear.emit()"
    >
      Clear
    </button>
  </div>
}
