<div class="flex flex-col gap-3">
  <div class="flex flex-wrap items-center gap-3" role="group" aria-label="Period">
    <p-selectButton
      [options]="presetOptions"
      [ngModel]="preset()"
      (ngModelChange)="onPresetChange($event)"
      optionLabel="label"
      optionValue="value"
      [allowEmpty]="false"
      class="custom-selectbutton"
    />
    @if (preset() === 'CUSTOM') {
      <div class="flex items-center gap-2">
        <p-datepicker
          [ngModel]="filter().startDate ?? null"
          (ngModelChange)="onCustomDate('startDate', $event)"
          dateFormat="mm/dd/yy"
          placeholder="Start date"
          ariaLabel="Start date"
        />
        <p-datepicker
          [ngModel]="filter().endDate ?? null"
          (ngModelChange)="onCustomDate('endDate', $event)"
          dateFormat="mm/dd/yy"
          placeholder="End date"
          ariaLabel="End date"
        />
      </div>
    }
  </div>

  <div class="flex flex-wrap items-center gap-2">
    <input
      type="search"
      class="min-w-64 flex-1 rounded-xl border border-surface-300 bg-surface-0 px-3 py-2 dark:border-surface-700 dark:bg-surface-900"
      placeholder="Search description or merchant"
      aria-label="Search description or merchant"
      [value]="filter().description ?? ''"
      (input)="onSearchInput($any($event.target).value)"
    />

    <p-button
      data-testid="filters-button"
      [label]="appliedCount() > 0 ? 'Filters ' + appliedCount() : 'Filters'"
      icon="pi pi-sliders-h"
      severity="secondary"
      [outlined]="true"
      (onClick)="filtersPopover.toggle($event)"
    />
    <p-popover #filtersPopover (onShow)="onPopoverShow()">
      <div class="flex w-72 flex-col gap-3">
        <label class="flex flex-col gap-1 text-sm">
          Account
          <p-select
            [options]="accounts()"
            optionLabel="name"
            optionValue="id"
            [(ngModel)]="draft.accountId"
            placeholder="Any account"
            [showClear]="true"
            appendTo="body"
          />
        </label>
        <label class="flex flex-col gap-1 text-sm">
          Category
          <p-select
            [options]="groupedCategories()"
            [group]="true"
            [(ngModel)]="draft.categoryName"
            placeholder="Any category"
            [showClear]="true"
            [filter]="true"
            appendTo="body"
          />
        </label>
        <label class="flex flex-col gap-1 text-sm">
          Type
          <p-select
            [options]="typeOptions"
            optionLabel="label"
            optionValue="value"
            [(ngModel)]="draft.type"
            placeholder="Any type"
            [showClear]="true"
            appendTo="body"
          />
        </label>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex flex-col gap-1 text-sm">
            Minimum amount
            <p-inputNumber [(ngModel)]="draft.minAmount" mode="currency" currency="USD" locale="en-US" />
          </label>
          <label class="flex flex-col gap-1 text-sm">
            Maximum amount
            <p-inputNumber [(ngModel)]="draft.maxAmount" mode="currency" currency="USD" locale="en-US" />
          </label>
        </div>
        <label class="flex flex-col gap-1 text-sm">
          Merchant
          <p-select
            [options]="merchantNames()"
            [(ngModel)]="draft.merchant"
            placeholder="Any merchant"
            [showClear]="true"
            [filter]="true"
            appendTo="body"
          />
        </label>
        <label class="flex flex-col gap-1 text-sm">
          Tag
          <p-select
            [options]="tags()"
            optionLabel="name"
            optionValue="id"
            [(ngModel)]="draft.tagId"
            placeholder="Any tag"
            [showClear]="true"
            appendTo="body"
          />
        </label>
        <p-button label="Apply filters" (onClick)="onApplyPopover(filtersPopover, draft)" />
      </div>
    </p-popover>
  </div>

  @if (chips().length > 0 || filter().description) {
    <div class="flex flex-wrap items-center gap-2">
      @for (chip of chips(); track chip.key) {
        <span
          data-testid="filter-chip"
          class="inline-flex items-center gap-1 rounded-full border border-primary-200 bg-primary-50 px-3 py-1 text-sm text-primary-700 dark:border-primary-800 dark:bg-primary-950/30 dark:text-primary-300"
        >
          {{ chip.label }}
          <button
            type="button"
            class="cursor-pointer"
            [attr.aria-label]="'Remove filter: ' + chip.label"
            (click)="onRemoveChip(chip)"
          >
            <i class="pi pi-times text-xs"></i>
          </button>
        </span>
      }
      <button
        type="button"
        data-testid="clear-all"
        class="cursor-pointer text-sm text-muted-color underline"
        (click)="onClearAll()"
      >
        Clear all
      </button>
    </div>
  }

  @if (resultCount() !== null) {
    <p data-testid="result-line" class="text-sm text-muted-color">
      {{ resultCount() }} {{ resultCount() === 1 ? 'transaction matches' : 'transactions match' }}
    </p>
  }
</div>
