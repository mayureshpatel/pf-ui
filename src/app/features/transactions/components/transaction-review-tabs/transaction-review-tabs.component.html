<div class="flex flex-wrap items-center justify-between gap-3">
  <div
    role="tablist"
    aria-label="Transaction views"
    class="inline-flex gap-1 rounded-xl bg-surface-100 p-1 dark:bg-surface-800"
  >
    <button
      type="button"
      role="tab"
      (keydown)="onTabKeydown($event)"
      [id]="tabId('ALL')"
      [attr.aria-controls]="tabPanelId"
      [attr.tabindex]="activeTab() === 'ALL' ? 0 : -1"
      [attr.aria-selected]="activeTab() === 'ALL'"
      class="cursor-pointer rounded-lg px-3 py-1.5 text-sm font-medium"
      [class]="
        activeTab() === 'ALL'
          ? 'bg-surface-0 text-surface-900 shadow-sm dark:bg-surface-900 dark:text-surface-0'
          : 'text-muted-color'
      "
      (click)="tabChange.emit('ALL')"
    >
      All
    </button>

    @if (uncategorizedCount() > 0 || activeTab() === 'NEEDS_CATEGORY') {
      <button
        type="button"
        role="tab"
        (keydown)="onTabKeydown($event)"
        [id]="tabId('NEEDS_CATEGORY')"
        [attr.aria-controls]="tabPanelId"
        [attr.tabindex]="activeTab() === 'NEEDS_CATEGORY' ? 0 : -1"
        [attr.aria-selected]="activeTab() === 'NEEDS_CATEGORY'"
        class="cursor-pointer rounded-lg px-3 py-1.5 text-sm font-medium"
        [class]="
          activeTab() === 'NEEDS_CATEGORY'
            ? 'bg-surface-0 text-surface-900 shadow-sm dark:bg-surface-900 dark:text-surface-0'
            : 'text-muted-color'
        "
        (click)="tabChange.emit('NEEDS_CATEGORY')"
      >
        Needs a category
        @if (uncategorizedCount() > 0) {
          <span
            class="ml-1 rounded-full bg-amber-700 px-1.5 text-xs font-semibold text-white tabular-nums"
            >{{ uncategorizedCount() | number }}</span
          >
        }
      </button>
    }
  </div>

  @if (transferCount() > 0) {
    <button
      type="button"
      class="cursor-pointer rounded-full border border-amber-300 bg-amber-50 px-3 py-1.5 text-sm font-medium text-amber-900 hover:border-amber-500 dark:border-amber-800 dark:bg-amber-950/30 dark:text-amber-100"
      (click)="reviewTransfers.emit()"
    >
      <span class="tabular-nums">{{ transferCount() | number }}</span> possible transfers, review
    </button>
  }
</div>
