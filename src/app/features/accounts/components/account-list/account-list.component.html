<div
  class="flex flex-col gap-4"
  [attr.aria-busy]="loading() ? 'true' : null"
  [class]="loading() && groups().length > 0 ? 'pointer-events-none opacity-60' : ''"
>
  @for (group of groups(); track group.key) {
    <section
      class="overflow-hidden rounded-2xl border border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-900"
      [attr.aria-label]="group.label"
    >
      <h2
        data-testid="group-heading"
        class="flex items-baseline justify-between bg-surface-100 px-4 py-2 text-sm font-semibold dark:bg-surface-800"
      >
        <span>{{ group.label }}</span>
        <span class="tabular-nums">
          {{ group.subtotal < 0 ? '-' : ''
          }}{{ (group.subtotal < 0 ? -group.subtotal : group.subtotal) | formatCurrency }}
        </span>
      </h2>
      <ul class="m-0 list-none p-0">
        @for (account of group.accounts; track account.id) {
          <li
            class="flex items-center gap-1 border-t border-surface-100 first:border-t-0 dark:border-surface-800"
            [class]="selectedId() === account.id ? 'bg-primary-50 dark:bg-primary-900/30' : ''"
          >
            <button
              type="button"
              data-testid="open-account"
              class="flex min-w-0 flex-1 cursor-pointer items-center gap-3 px-4 py-3 text-left"
              (click)="openAccount.emit(account)"
            >
              <i
                [class]="'pi ' + account.type.icon + ' ' + account.type.color"
                aria-hidden="true"
              ></i>
              <span class="min-w-0 flex-1">
                <span class="block truncate font-medium text-surface-900 dark:text-surface-0">
                  {{ account.name }}
                </span>
                @if (bankLabel(account.bank)) {
                  <span class="block text-sm text-muted-color">{{ bankLabel(account.bank) }}</span>
                }
              </span>
              <span
                class="font-semibold tabular-nums"
                [class.text-rose-700]="account.currentBalance < 0"
                [class.dark:text-rose-400]="account.currentBalance < 0"
                [class.text-muted-color]="account.currentBalance === 0"
              >
                {{ account.currentBalance < 0 ? '-' : ''
                }}{{
                  (account.currentBalance < 0 ? -account.currentBalance : account.currentBalance)
                    | formatCurrency
                }}
              </span>
            </button>
            <button
              type="button"
              data-testid="account-menu"
              class="mr-2 cursor-pointer rounded-lg px-2 py-2 text-muted-color"
              aria-haspopup="menu"
              [attr.aria-label]="'Actions for ' + account.name"
              (click)="toggleMenu($event, account)"
            >
              <i class="pi pi-ellipsis-h" aria-hidden="true"></i>
            </button>
          </li>
        }
      </ul>
    </section>
  }

  <p-menu #menu [model]="menuModel" [popup]="true" appendTo="body" />
</div>
