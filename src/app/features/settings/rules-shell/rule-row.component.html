<button
  type="button"
  data-rule-row
  class="flex w-full cursor-pointer items-start justify-between gap-3 rounded-xl border p-3 text-left"
  [class]="
    selected()
      ? 'border-primary-700 bg-primary-50 dark:border-primary-400 dark:bg-primary-950'
      : 'border-surface-200 bg-surface-0 hover:bg-surface-50 dark:border-surface-800 dark:bg-surface-900 dark:hover:bg-surface-800'
  "
  [attr.aria-current]="selected() ? 'true' : null"
>
  <span class="flex min-w-0 flex-col gap-2">
    <span class="flex flex-wrap items-center gap-1.5">
      <span class="sr-only">Keywords:</span>
      @for (keyword of rule().keywords; track $index; let last = $last) {
        <span class="rounded-md bg-surface-100 px-2 py-0.5 text-sm font-medium dark:bg-surface-800">
          {{ keyword }}
        </span>
        @if (!last) {
          <span class="text-xs text-muted-color">{{
            rule().matchType === 'AND' ? 'and' : 'or'
          }}</span>
        }
      }
      <span class="sr-only">.</span>
    </span>
    <span class="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-muted-color">
      <span class="flex items-center gap-1.5">
        <span class="sr-only">{{ targetLabel() }}:</span>
        <ng-content />
      </span>
      @if (limits(); as text) {
        <span class="sr-only">, amount:</span>
        <span class="tabular-nums">{{ text }}</span>
      }
    </span>
  </span>
  @if (rule().priority !== 0) {
    <span class="sr-only">.</span>
    <span class="shrink-0 text-sm tabular-nums text-muted-color"
      >Priority {{ rule().priority }}</span
    >
  }
</button>
