<form (ngSubmit)="submit()" [formGroup]="form" class="flex flex-col gap-4">
  <app-rule-form-fields
    [keywordsError]="keywordsError()"
    [priorityError]="priorityError()"
    [amountError]="amountError()"
  >
    <div class="flex flex-col gap-1">
      <label id="rule-merchant-label" for="rule-merchant" class="text-sm font-medium"
        >Merchant</label
      >
      <p-select
        inputId="rule-merchant"
        ariaLabelledBy="rule-merchant-label"
        formControlName="merchant"
        [options]="options()"
        [filter]="true"
        (onFilter)="onMerchantFilter($event)"
        filterBy="name,city"
        dataKey="id"
        optionLabel="name"
        placeholder="Choose a merchant"
        emptyMessage="No merchants"
        emptyFilterMessage="No merchants found"
        appendTo="body"
      >
        <ng-template #item let-merchant>
          @if (isCreateOption(merchant)) {
            <span class="flex items-center gap-2">
              <i class="pi pi-plus text-xs" aria-hidden="true"></i>
              Create "{{ merchant.name }}"
            </span>
          } @else {
            {{ merchant.name }}
          }
        </ng-template>
      </p-select>
      @if (merchantError(); as error) {
        <small class="text-rose-700 dark:text-rose-400">{{ error }}</small>
      }
    </div>
  </app-rule-form-fields>

  @if (errorMessage(); as message) {
    <p role="alert" class="m-0 text-sm text-rose-700 dark:text-rose-400">{{ message }}</p>
  }

  @if (isEditMode()) {
    <button
      type="button"
      class="cursor-pointer self-start rounded-lg border border-rose-300 px-3 py-1.5 text-sm max-md:min-h-11 text-rose-700 hover:bg-rose-50 disabled:cursor-not-allowed disabled:opacity-50 dark:border-rose-800 dark:text-rose-400 dark:hover:bg-rose-950"
      [disabled]="saving()"
      (click)="remove.emit()"
    >
      Delete rule
    </button>
  }
</form>
