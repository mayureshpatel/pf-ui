<app-rules-page-shell
  heading="Merchant rules"
  nounText="merchant rules"
  emptyText="Rules give a merchant to transactions when their description contains a keyword. Transactions linked to a merchant by an exact description link are left alone."
  overviewText="Rules run when transactions are imported, after exact description links. When several match, the highest priority wins."
  [rulesCount]="rules().length"
  [visibleCount]="visibleRules().length"
  [loading]="loading()"
  [loadedOnce]="loadedOnce()"
  [loadError]="loadError()"
  [applying]="applying()"
  [saving]="saving()"
  [panelMode]="panelMode()"
  [panelTitle]="panelTitle()"
  [onlyAddMode]="onlyAddMode()"
  [(search)]="search"
  (add)="startAdd()"
  (apply)="openApplyPreview()"
  (retry)="loadRules()"
  (panelSave)="onPanelSave()"
  (panelClose)="onPanelClose()"
>
  <ul rows class="m-0 flex list-none flex-col gap-2 p-0">
    @for (rule of visibleRules(); track rule.id) {
      <li>
        <app-rule-row
          [rule]="rule"
          [selected]="selectedRuleId() === rule.id"
          targetLabel="Merchant"
          (click)="openRule(rule)"
        >
          <i aria-hidden="true" class="pi pi-shop text-xs text-muted-color"></i>
          <span class="text-color">{{ rule.merchant?.name || 'No merchant' }}</span>
        </app-rule-row>
      </li>
    }
  </ul>

  <div panel>
    @switch (panelMode()) {
      @case ('rule') {
        @if (selectedRule(); as rule) {
          <app-merchant-rule-edit-form
            #ruleForm
            [rule]="rule"
            [merchants]="merchants()"
            [saving]="saving()"
            (save)="saveRule($event)"
            (remove)="deleteSelected()"
            (draftChange)="draft.set($event)"
          />
          <app-rule-match-list
            class="mt-4 block"
            [draft]="draft()"
            [invalid]="ruleForm.keywordsInvalid()"
          />
        } @else {
          <p-skeleton height="8rem" borderRadius="1rem" />
        }
      }
      @case ('add') {
        <app-merchant-rule-edit-form
          #ruleForm
          [rule]="null"
          [merchants]="merchants()"
          [saving]="saving()"
          (save)="saveRule($event)"
          (draftChange)="draft.set($event)"
        />
        <app-rule-match-list
          class="mt-4 block"
          [draft]="draft()"
          [invalid]="ruleForm.keywordsInvalid()"
        />
      }
    }
  </div>
</app-rules-page-shell>

<app-apply-rules-dialog
  [(visible)]="showApplyDialog"
  [previewItems]="previewItems()"
  [loading]="applying()"
  fieldLabel="Merchant"
  (confirm)="confirmApply()"
/>
