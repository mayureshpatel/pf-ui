<nav aria-label="Settings sections">
  <ul
    role="list"
    class="m-0 flex list-none snap-x gap-2 overflow-x-auto p-1 lg:flex-col lg:overflow-visible lg:p-0"
  >
    @for (item of items; track item.key) {
      <li class="shrink-0 snap-start">
        @if (item.moved; as moved) {
          <a
            class="no-underline text-inherit"
            [class]="itemClass + ' ' + idleClass"
            [routerLink]="moved.path"
            [queryParams]="moved.params"
          >
            <i class="pi" [class]="item.icon" aria-hidden="true"></i>
            {{ item.label }}
            <span class="text-xs font-normal text-muted-color">{{ moved.where }}</span>
          </a>
        } @else {
          <button
            type="button"
            [class]="itemClass + ' ' + (section() === item.key ? activeClass : idleClass)"
            [attr.aria-current]="section() === item.key ? 'page' : null"
            (click)="sectionChange.emit(sectionOf(item))"
          >
            <i class="pi" [class]="item.icon" aria-hidden="true"></i>
            {{ item.label }}
          </button>
        }
      </li>
    }
  </ul>
</nav>
