<section class="flex flex-col gap-4">
  <h2 class="m-0 text-xl font-semibold">Appearance</h2>
  <div role="radiogroup" aria-label="Theme" class="grid max-w-xl grid-cols-1 gap-4 sm:grid-cols-2">
    <label
      class="flex cursor-pointer flex-col gap-3 rounded-xl border-2 p-3 has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-primary-700"
      [class]="
        !theme.isDarkMode()
          ? 'border-primary-700 dark:border-primary-400'
          : 'border-surface-200 hover:border-surface-300 dark:border-surface-700'
      "
    >
      <input
        type="radio"
        name="theme"
        class="sr-only"
        [checked]="!theme.isDarkMode()"
        (change)="theme.setDarkMode(false)"
      />
      <span
        aria-hidden="true"
        class="flex h-20 flex-col gap-2 rounded-lg border border-stone-200 bg-stone-50 p-2"
      >
        <span class="h-3 w-1/3 rounded bg-stone-300"></span>
        <span class="flex-1 rounded bg-white shadow-sm"></span>
      </span>
      <span class="font-semibold">Light</span>
    </label>
    <label
      class="flex cursor-pointer flex-col gap-3 rounded-xl border-2 p-3 has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-primary-700"
      [class]="
        theme.isDarkMode()
          ? 'border-primary-700 dark:border-primary-400'
          : 'border-surface-200 hover:border-surface-300 dark:border-surface-700'
      "
    >
      <input
        type="radio"
        name="theme"
        class="sr-only"
        [checked]="theme.isDarkMode()"
        (change)="theme.setDarkMode(true)"
      />
      <span
        aria-hidden="true"
        class="flex h-20 flex-col gap-2 rounded-lg border border-stone-700 bg-stone-950 p-2"
      >
        <span class="h-3 w-1/3 rounded bg-stone-700"></span>
        <span class="flex-1 rounded bg-stone-800"></span>
      </span>
      <span class="font-semibold">Dark</span>
    </label>
  </div>
</section>
