<div class="flex w-full flex-col gap-6">
  <app-screen-toolbar [showDivider]="false">
    <div toolbarTitle>
      <h1 class="text-4xl font-extrabold tracking-tight text-surface-900 dark:text-surface-0">
        Settings
      </h1>
    </div>
  </app-screen-toolbar>

  <div class="flex flex-col gap-6 lg:flex-row lg:items-start">
    <div class="lg:w-56 lg:shrink-0">
      <app-settings-nav [section]="section()" (sectionChange)="choose($event)" />
    </div>
    <div class="min-w-0 flex-1">
      @switch (section()) {
        @case ('appearance') {
          <app-appearance-settings />
        }
        @case ('tags') {
          <app-tags />
        }
        @default {
          <app-category-rules />
        }
      }
    </div>
  </div>
</div>
