<div
  data-testid="recurring-list"
  class="flex flex-col gap-3"
  [attr.aria-busy]="loading() ? 'true' : null"
  [class]="loading() && groups().length > 0 ? 'pointer-events-none opacity-60' : ''"
>
  @for (group of groups(); track group.key) {
    <section
      class="overflow-hidden rounded-2xl border border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-900"
    >
      <div
        data-testid="group-header"
        class="flex items-center justify-between gap-3 bg-surface-100 px-4 py-2 text-sm font-semibold dark:bg-surface-800"
      >
        <h2 class="m-0 text-sm font-semibold">{{ group.label }}</h2>
        @if (group.monthlyTotal !== null) {
          <span class="tabular-nums">{{ group.monthlyTotal | currency }} / mo</span>
        } @else {
          <span class="text-muted-color">{{ pausedLabel(group.items.length) }}</span>
        }
      </div>
      <ul class="m-0 list-none p-0">
        @for (item of group.items; track item.id) {
          <li class="border-t border-surface-100 first:border-t-0 dark:border-surface-800">
            <div
              data-testid="item-row"
              [class]="selectedId() === item.id ? 'bg-primary-50 dark:bg-primary-900/30' : ''"
            >
              <button
                type="button"
                data-testid="open-item"
                class="flex w-full min-w-0 cursor-pointer items-center gap-3 px-4 py-3 text-left"
                (click)="openItem.emit(item)"
              >
                <span class="min-w-0 flex-1">
                  <span class="block truncate font-medium text-surface-900 dark:text-surface-0">
                    {{ item.merchant.name || 'Unknown merchant' }}
                  </span>
                  <span class="block truncate text-sm text-muted-color">
                    <span [class]="schedule(item).late ? 'text-amber-700 dark:text-amber-400' : ''">
                      {{ schedule(item).text }}
                    </span>
                    @if (item.account?.name) {
                      · {{ item.account.name }}
                    }
                  </span>
                  @if (priceChange(item); as change) {
                    <span
                      data-testid="price-change"
                      class="block text-sm text-amber-700 dark:text-amber-400"
                    >
                      {{ change }}
                    </span>
                  }
                </span>
                <span class="shrink-0 font-semibold tabular-nums">{{
                  item.amount | currency
                }}</span>
              </button>
            </div>
          </li>
        }
      </ul>
    </section>
  }
</div>
