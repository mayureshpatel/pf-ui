<div
  class="flex flex-col gap-4"
  [attr.aria-busy]="loading() ? 'true' : null"
  [class]="loading() && groups().length > 0 ? 'pointer-events-none opacity-60' : ''"
>
  @for (group of groups(); track group.key) {
    <section
      class="overflow-hidden rounded-2xl border border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-900"
      [attr.aria-label]="group.label"
    >
      <h2
        data-testid="group-heading"
        class="flex items-baseline justify-between bg-surface-100 px-4 py-2 text-sm font-semibold dark:bg-surface-800"
      >
        <span>{{ group.label }}</span>
        <span
          class="tabular-nums"
          [class.text-rose-700]="group.leftSubtotal < 0"
          [class.dark:text-rose-400]="group.leftSubtotal < 0"
        >
          @if (group.leftSubtotal < 0) {
            {{ -group.leftSubtotal | formatCurrency }} over
          } @else {
            {{ group.leftSubtotal | formatCurrency }} left
          }
        </span>
      </h2>
      <ul class="m-0 list-none p-0">
        @for (row of group.rows; track row.status.category.id) {
          <li
            class="border-t border-surface-100 first:border-t-0 dark:border-surface-800"
            [class]="
              selectedCategoryId() === row.status.category.id
                ? 'bg-primary-50 dark:bg-primary-900/30'
                : ''
            "
          >
            <button
              type="button"
              data-testid="open-budget"
              class="flex w-full cursor-pointer items-center gap-3 px-4 py-3 text-left"
              [attr.aria-label]="label(row)"
              (click)="openCategory.emit(row)"
            >
              <i
                class="pi"
                [class]="row.status.category.icon || 'pi-tag'"
                [style.color]="row.status.category.color || categoryColor(row.status.category.name)"
                aria-hidden="true"
              ></i>
              <span class="min-w-0 flex-1">
                <span class="block truncate font-medium text-surface-900 dark:text-surface-0">
                  {{ row.status.category.name }}
                </span>
                <span class="block text-sm text-muted-color tabular-nums">
                  {{ row.status.spentAmount | formatCurrency }} of
                  {{ row.status.budgetedAmount | formatCurrency }}
                </span>
                <span
                  class="mt-1 block h-2 overflow-hidden rounded-full bg-surface-200 dark:bg-surface-700"
                  aria-hidden="true"
                >
                  <span
                    data-testid="budget-bar"
                    class="block h-full rounded-full"
                    [class]="barClass(group.key)"
                    [style.width.%]="width(row)"
                  ></span>
                </span>
              </span>
              <span
                class="text-sm font-semibold tabular-nums"
                [class.text-rose-700]="left(row) < 0"
                [class.dark:text-rose-400]="left(row) < 0"
              >
                @if (left(row) < 0) {
                  {{ -left(row) | formatCurrency }} over
                } @else {
                  {{ left(row) | formatCurrency }} left
                }
              </span>
            </button>
          </li>
        }
      </ul>
    </section>
  }
</div>
