<!-- PF-945: appended to the body so Esc, which PrimeNG listens for on the document, cannot also reach the side panel behind this dialog and raise its Discard prompt. -->
<p-dialog
  [header]="title()"
  [(visible)]="visible"
  appRestoreFocusOnHide
  appendTo="body"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '28rem' }"
  [breakpoints]="{ '960px': '95vw' }"
>
  <div class="flex flex-col gap-4">
    <p class="text-sm text-muted-color">
      {{ addCount() }} new, {{ overwriteCount() }} to overwrite.
    </p>
    <p class="text-sm text-muted-color">
      Fill gaps only adds limits for categories that have none yet. Replace all also changes the
      limits that differ from last month.
    </p>
  </div>
  <!-- PF-877: Fill gaps first, so it (or Replace all when there is nothing to add) takes default focus, never Cancel. -->
  <ng-template #footer>
    <p-button
      label="Fill gaps"
      styleClass="min-h-11"
      [disabled]="addCount() === 0"
      (onClick)="onFill()"
    />
    <p-button
      label="Replace all"
      severity="secondary"
      variant="outlined"
      styleClass="min-h-11"
      [disabled]="addCount() + overwriteCount() === 0"
      (onClick)="onReplace()"
    />
    <p-button
      label="Cancel"
      severity="secondary"
      variant="text"
      styleClass="min-h-11"
      (onClick)="onCancel()"
    />
  </ng-template>
</p-dialog>
