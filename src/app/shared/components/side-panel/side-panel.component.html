<aside
  tabindex="-1"
  [attr.aria-label]="title()"
  [attr.role]="modal() ? 'dialog' : null"
  [attr.aria-modal]="modal() ? 'true' : null"
  class="flex flex-col overflow-y-auto bg-surface-0 p-4 outline-none dark:bg-surface-900"
  [class]="
    sheet()
      ? 'fixed inset-0 z-40 lg:static lg:z-auto lg:rounded-xl lg:border lg:border-surface-200 lg:dark:border-surface-800'
      : 'rounded-xl border border-surface-200 dark:border-surface-800'
  "
  (keydown.escape)="onEscape($event)"
>
  <div class="mb-3 flex items-center justify-between gap-2">
    <h2 class="heading-card min-w-0 break-words">{{ title() }}</h2>
    @if (showClose()) {
      <button
        type="button"
        aria-label="Close"
        class="inline-flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-md hover:bg-surface-100 dark:hover:bg-surface-800 max-lg:size-11"
        (click)="closePanel.emit()"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    }
  </div>

  <div class="flex-1"><ng-content /></div>

  @if (showFooter()) {
    <div
      class="mt-4 flex items-center justify-end gap-2 border-t border-surface-200 pt-3 dark:border-surface-800"
    >
      @if (showDelete()) {
        <button
          type="button"
          class="cursor-pointer rounded-lg border border-rose-300 px-3 dark:border-rose-800 py-2 text-sm max-lg:min-h-11 text-rose-700 dark:text-rose-400"
          (click)="delete.emit()"
        >
          Delete
        </button>
      }
      <button
        type="button"
        class="cursor-pointer rounded-lg border border-primary-700 bg-primary-700 px-3 py-2 text-sm max-lg:min-h-11 font-medium text-white hover:bg-primary-800 disabled:opacity-50"
        [disabled]="saving() || !valid()"
        (click)="save.emit()"
      >
        {{ saving() ? 'Saving...' : saveLabel() }}
      </button>
    </div>
  }
</aside>
