<div role="alert" class="flex min-h-80 flex-col items-center justify-center text-center">
  <i
    class="pi pi-exclamation-triangle mb-4 text-4xl text-amber-700 dark:text-amber-400"
    aria-hidden="true"
  ></i>
  <h2 class="heading-section mb-3">Couldn't load this page</h2>
  <p class="max-w-lg text-lg leading-relaxed text-muted-color">{{ message() }}</p>
  <p class="mb-6 mt-1 text-sm text-muted-color">
    Your data is unchanged. Try again, and if it keeps happening, give it a few minutes.
  </p>

  <p-button
    [label]="retrying() ? 'Retrying…' : 'Retry'"
    icon="pi pi-refresh"
    [loading]="retrying()"
    (onClick)="onRetry()"
    severity="primary"
  />
</div>
