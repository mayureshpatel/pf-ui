<div class="flex flex-col items-center justify-center min-h-[60vh] text-center animate-fade-in">
  <div class="relative mb-8">
    <div class="absolute -inset-4 bg-amber-500/10 rounded-full blur-2xl animate-pulse"></div>
    <i class="pi pi-exclamation-triangle text-8xl text-amber-500/60 relative"></i>
  </div>
  <h2 class="text-3xl font-bold text-surface-900 dark:text-surface-0 mb-3">Something Went Wrong</h2>
  <p class="text-muted-color mb-8 max-w-lg leading-relaxed text-lg">
    {{ message() }}
  </p>

  <p-button
    label="Retry"
    icon="pi pi-refresh"
    (onClick)="retry.emit()"
    severity="primary"
    [raised]="true"
  />
</div>
