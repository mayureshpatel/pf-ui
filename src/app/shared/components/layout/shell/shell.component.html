<a
  href="#main-content"
  data-testid="skip-link"
  (click)="skipToMain($event)"
  class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-surface-0 focus:px-4 focus:py-3 focus:text-primary-700 focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary-600 dark:focus:bg-surface-900 dark:focus:text-primary-400"
  >Skip to main content</a
>

<!-- The drawer is appended to the body, so it sits outside this grid; while it is open the grid is inert, which keeps Tab and screen readers inside the drawer. -->
<div
  class="grid grid-cols-5 grid-rows-[auto_1fr] min-h-screen"
  [attr.inert]="sidebarVisible() ? '' : null"
>
  <!-- Header -->
  <header
    class="col-span-5 flex items-center justify-between px-4 sm:px-6 h-16 border-b border-b-surface-200 dark:border-b-surface-800"
  >
    <div class="flex items-center gap-3">
      <p-button
        #openNav
        icon="pi pi-bars"
        [text]="true"
        severity="secondary"
        (onClick)="toggleSidebar()"
        ariaLabel="Open navigation"
        [buttonProps]="{ autofocus: false }"
        styleClass="size-11"
        class="lg:hidden"
      />

      <i class="pi pi-wallet text-xl text-primary" aria-hidden="true"></i>
      <span class="whitespace-nowrap text-base font-semibold">Personal Finance</span>
    </div>

    <div class="hidden items-center gap-4 sm:flex">
      <span class="text-muted-color">{{ username() }}</span>
      <p-avatar
        aria-hidden="true"
        [label]="username().charAt(0).toUpperCase()"
        shape="circle"
        class="bg-primary-700 text-white dark:bg-primary-400 dark:text-surface-900"
      />

      <p-button
        icon="pi pi-sign-out"
        [text]="true"
        severity="danger"
        (onClick)="logout()"
        pTooltip="Logout"
        ariaLabel="Logout"
        styleClass="size-11"
      />
    </div>
  </header>

  <!-- Left Navigation (desktop) -->
  <div class="hidden border-r border-r-surface-200 dark:border-r-surface-800 lg:block">
    <nav
      aria-label="Main Navigation"
      class="sticky top-0 flex max-h-screen flex-col gap-1 overflow-y-auto p-4"
    >
      <ng-container [ngTemplateOutlet]="navLinks" />
    </nav>
  </div>

  <!-- Main Content -->
  <main
    id="main-content"
    tabindex="-1"
    class="outline-none col-span-5 lg:col-span-4 flex-1 w-full p-4 md:p-6 lg:p-8 max-w-[100vw] overflow-x-hidden"
  >
    <router-outlet />
  </main>
</div>

<!-- Navigation drawer (tablet and phone) -->
<p-drawer
  [(visible)]="sidebarVisible"
  [modal]="true"
  appendTo="body"
  ariaCloseLabel="Close navigation"
  [pt]="drawerPt"
  class="lg:hidden"
  (onShow)="focusDrawer()"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-2">
      <i class="pi pi-wallet text-xl text-primary" aria-hidden="true"></i>
      <span class="text-base font-semibold">Personal Finance</span>
    </div>
  </ng-template>
  <nav aria-label="Main Navigation" data-testid="drawer-nav" class="mt-4 flex flex-col gap-1">
    <ng-container [ngTemplateOutlet]="navLinks" />
  </nav>
  <ng-template pTemplate="footer">
    <p-button
      data-testid="drawer-logout"
      label="Log out"
      icon="pi pi-sign-out"
      [text]="true"
      severity="danger"
      styleClass="w-full justify-start"
      class="sm:hidden"
      (onClick)="logout()"
    />
  </ng-template>
</p-drawer>

<ng-template #navLinks>
  @for (item of navItems; track item.label) {
    <a
      [routerLink]="item.routerLink"
      routerLinkActive="bg-primary-100 text-primary-700 dark:bg-primary-950 dark:text-primary-400"
      ariaCurrentWhenActive="page"
      class="flex items-center gap-3 rounded-lg px-4 py-3 transition-colors hover:bg-surface-100 dark:hover:bg-surface-800"
      (click)="sidebarVisible.set(false)"
    >
      <i [class]="item.icon" aria-hidden="true"></i>
      <span>{{ item.label }}</span>
    </a>
  }
</ng-template>
