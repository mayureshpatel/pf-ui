name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The unit test suite itself runs on Playwright's chromium (via
      # @vitest/browser-playwright), not just E2E -- a fresh runner has no
      # browser binaries cached, so this is needed for `npm run test` to
      # work at all here, not only for a future Playwright E2E suite.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test -- --watch=false --browsers=chromium --headless
